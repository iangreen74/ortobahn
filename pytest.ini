[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts =
    --verbose
    --strict-markers
    --strict-config
    --cov=ortobahn
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70
    --maxfail=5
    --tb=short
    --durations=10

# Markers for test organization
markers =
    unit: Unit tests that test individual components
    integration: Integration tests that test multiple components together
    e2e: End-to-end tests that test the full application
    slow: Tests that take a long time to run
    security: Security-related tests
    mcp: Tests for MCP server functionality
    web: Tests for web interface
    cli: Tests for CLI functionality
    api: Tests for API endpoints
    database: Tests requiring database access

# Coverage configuration
[coverage:run]
source = ortobahn
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */.venv/*
    */migrations/*
    */__main__.py

branch = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    class .*\bProtocol\):
    @overload

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
